name: Deploy openGym to Cloudflare Workers

# The Cloudflare Worker deployment (docs/cloudflare-migration/README.md): typecheck, build the
# app with its 180 px exercise media, apply pending D1 migrations, deploy. Without the two
# Cloudflare secrets it stops after the build, so forks without an account still get the checks.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read in a step's `if:`; whether they are set can, through env.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker and MCP dependencies
        run: |
          npm ci --prefix worker
          # The remote MCP runs upstream's own tools from mcp/src (worker/src/mcp-bridge.ts).
          npm ci --prefix mcp --ignore-scripts

      - name: Typecheck Worker
        working-directory: worker
        run: npm run typecheck

      - name: Build the app and stage the 180 px exercise media (under 20,000 files)
        run: node scripts/build-worker-assets.mjs

      - name: Apply D1 migrations and deploy
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply opengym-db --remote -c ../wrangler.jsonc
          npx wrangler deploy -c ../wrangler.jsonc
