name: Deploy openGym to Cloudflare Workers

# The Cloudflare Worker deployment (docs/cloudflare-migration/README.md): typecheck, build the
# app with its 180 px exercise media, apply pending D1 migrations, deploy. Without the two
# Cloudflare secrets it stops after the build, so forks without an account still get the checks.
#
# Manual only for now: deploys are built and run locally (npm run build:assets, npm run deploy).
# To deploy on every push again, add `push: branches: [main]` under `on`.

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read in a step's `if:`; whether they are set can, through env.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (pnpm workspace: worker, mcp, frontend)
        run: pnpm install --frozen-lockfile

      - name: Typecheck Worker
        run: pnpm typecheck

      - name: Build the app and stage the 180 px exercise media (under 20,000 files)
        run: pnpm build:assets --skip-install

      - name: Apply D1 migrations and deploy
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm cf:migrate
          pnpm cf:deploy
